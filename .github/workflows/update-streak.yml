name: Update Streak Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-streak:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create output directory
        run: mkdir -p assets/stats
      
      - name: Fetch GitHub Streak Stats
        run: |
          curl -s "https://github-readme-streak-stats-eight.vercel.app/?user=Firstqus&theme=tokyonight&hide_border=true" > assets/stats/streak.svg
          
          if [ -f assets/stats/streak.svg ]; then
            echo "✅ Streak stats fetched successfully"
          else
            echo "❌ Failed to fetch streak stats"
            exit 1
          fi
      
      - name: Fetch GitHub Stats
        run: |
          curl -s "https://github-readme-stats.vercel.app/api?username=Firstqus&show_icons=true&theme=tokyonight&hide_border=true" > assets/stats/stats.svg
      
      - name: Fetch Top Languages
        run: |
          curl -s "https://github-readme-stats.vercel.app/api/top-langs/?username=Firstqus&layout=compact&theme=tokyonight&hide_border=true" > assets/stats/languages.svg
      
      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
      
      - name: Check for changes
        id: verify_changed_files
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push changes
        if: steps.verify_changed_files.outputs.changed == 'true'
        run: |
          git add assets/stats/
          git commit -m "chore: update github stats"
          git push
